name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-safety:
    name: Type safety and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- --ci

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  deploy-development:
    name: Deploy to development (target not configured)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - type-safety
      - unit-tests
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Report missing deployment configuration
        run: |
          echo "::error title=Deployment target not configured::Select a development hosting platform and configure its deployment credentials before enabling this job."
          exit 1

  deploy-production:
    name: Deploy to production (target not configured)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs:
      - type-safety
      - unit-tests
      - dependency-audit
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Report missing deployment configuration
        run: |
          echo "::error title=Deployment target not configured::Select a production hosting platform, configure deployment credentials, and require production environment approval before enabling this job."
          exit 1
